  <style>
    /* =================================================================
       Tasarım belirteçleri — renkler konudan: keten, yosun, adaçayı, güneş okeri
       ================================================================= */
    :root {
      color-scheme: light;
      --bg: #F3F1EA;
      --bg-elev: #FBFAF6;
      --bg-sunken: #ECE9E0;
      --line: rgba(30, 36, 28, .085);
      --line-strong: rgba(30, 36, 28, .16);
      --ink: #161A15;
      --ink-2: #4A5147;
      --ink-3: #7F877B;
      --accent: #2F4B37;
      --accent-ink: #F3F1EA;
      --accent-soft: rgba(47, 75, 55, .075);
      --sun: #B4843A;
      --sky: #4F6E78;
      --topo: rgba(47, 75, 55, .15);
      --map-filter: saturate(.55) contrast(.95) brightness(1.02);
      --shadow: 0 1px 0 rgba(255, 255, 255, .7) inset, 0 1px 2px rgba(22, 26, 20, .04), 0 10px 30px -18px rgba(22, 26, 20, .18);
      --shadow-hover: 0 1px 0 rgba(255, 255, 255, .7) inset, 0 2px 4px rgba(22, 26, 20, .04), 0 22px 44px -22px rgba(22, 26, 20, .28);

      --serif: 'Sentient', 'Iowan Old Style', Georgia, serif;
      --sans: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --spring: cubic-bezier(.34, 1.36, .64, 1);
      --r: 20px;
      --r-lg: 28px;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0E110F;
      --bg-elev: #151916;
      --bg-sunken: #0B0D0B;
      --line: rgba(226, 233, 219, .075);
      --line-strong: rgba(226, 233, 219, .15);
      --ink: #ECEFE7;
      --ink-2: #A7AFA2;
      --ink-3: #6E776B;
      --accent: #A9C69F;
      --accent-ink: #0E110F;
      --accent-soft: rgba(169, 198, 159, .09);
      --sun: #D8B169;
      --sky: #8DAEB8;
      --topo: rgba(169, 198, 159, .11);
      --map-filter: invert(.9) hue-rotate(180deg) saturate(.45) brightness(.95) contrast(.9);
      --shadow: 0 1px 0 rgba(255, 255, 255, .035) inset, 0 12px 32px -18px rgba(0, 0, 0, .7);
      --shadow-hover: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 24px 48px -22px rgba(0, 0, 0, .8);
    }

    /* ============================== Temel ============================== */
    *, *::before, *::after { box-sizing: border-box; }
    [x-cloak] { display: none !important; }
    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
      scroll-padding-top: 104px;
      background: var(--bg);
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      -webkit-tap-highlight-color: transparent;
      font-feature-settings: "ss01", "kern";
    }
    body.locked { overflow: hidden; }
    ::selection { background: var(--accent); color: var(--accent-ink); }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
    .wrap { max-width: 1180px; margin: 0 auto; padding-left: max(22px, env(safe-area-inset-left)); padding-right: max(22px, env(safe-area-inset-right)); }
    @media (min-width: 768px) { .wrap { padding-left: 40px; padding-right: 40px; } }
    .num { font-variant-numeric: tabular-nums; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .ico { width: 18px; height: 18px; flex: none; display: block; }
    .ico svg { width: 100%; height: 100%; display: block; }

    /* Tema geçişi (View Transitions) */
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

    /* Topografik doku */
    .topo {
      position: absolute; inset: 0; pointer-events: none;
      background: var(--topo);
      -webkit-mask: url(assets/img/topo.svg) center / cover no-repeat;
      mask: url(assets/img/topo.svg) center / cover no-repeat;
    }

    /* Izgara öğeleri içerikleri (ör. kaydırılabilir sekmeler) yüzünden genişlemesin */
    .rv, .head > * { min-width: 0; }

    /* Görünüme girerken yumuşak beliriş */
    .js [data-reveal] {
      opacity: 0; transform: translateY(18px); filter: blur(6px);
      transition: opacity 1s var(--ease) var(--d, 0ms), transform 1.1s var(--ease) var(--d, 0ms), filter 1s var(--ease) var(--d, 0ms);
    }
    .js [data-reveal].in { opacity: 1; transform: none; filter: none; }

    /* ============================== Bileşenler ============================== */
    .card {
      position: relative;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow);
      transition: transform .6s var(--ease), box-shadow .6s var(--ease), border-color .6s var(--ease), background-color .5s var(--ease);
    }
    .card.lift:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--line-strong); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      height: 50px; padding: 0 24px; border-radius: 999px;
      font-size: 15px; font-weight: 500; letter-spacing: .005em; text-decoration: none; white-space: nowrap;
      border: 1px solid transparent; cursor: pointer;
      transition: transform .25s var(--ease), background-color .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease), color .35s var(--ease);
    }
    .btn:active { transform: scale(.965); }
    .btn .ico { transition: transform .45s var(--ease); }
    .btn:hover .ico { transform: translateX(3px); }
    .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 10px 24px -12px var(--accent); }
    .btn-primary:hover { background: color-mix(in oklab, var(--accent) 86%, var(--ink)); }
    .btn-ghost { background: var(--bg-elev); color: var(--ink); border-color: var(--line); box-shadow: var(--shadow); }
    .btn-ghost:hover { border-color: var(--line-strong); }
    .btn.sm { height: 40px; padding: 0 16px; font-size: 14px; gap: 8px; }

    .icon-btn {
      width: 40px; height: 40px; flex: none; display: grid; place-items: center;
      border-radius: 999px; border: 1px solid var(--line); background: var(--bg-elev); color: var(--ink);
      cursor: pointer; transition: transform .25s var(--ease), border-color .3s var(--ease), background-color .3s var(--ease);
    }
    .icon-btn:hover { border-color: var(--line-strong); }
    .icon-btn:active { transform: scale(.9); }

    /* Kayan göstergeli sekmeler (segmented control) */
    .seg {
      position: relative; display: inline-flex; max-width: 100%;
      padding: 4px; border-radius: 999px;
      background: var(--bg-sunken); border: 1px solid var(--line);
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .seg::-webkit-scrollbar { display: none; }
    .seg button {
      position: relative; z-index: 1; flex: none;
      border: 0; background: none; cursor: pointer;
      padding: 9px 18px; border-radius: 999px;
      font-size: 14.5px; font-weight: 500; color: var(--ink-3); white-space: nowrap;
      transition: color .35s var(--ease);
    }
    .seg button:hover { color: var(--ink-2); }
    .seg button[aria-selected="true"] { color: var(--ink); }
    .seg .thumb {
      position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0;
      border-radius: 999px; background: var(--bg-elev);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 0 0 1px var(--line), 0 6px 16px -10px rgba(0, 0, 0, .25);
      transition: transform .55s var(--spring), width .55s var(--spring);
    }
    .seg.sm { padding: 3px; }
    .seg.sm button { padding: 5px 11px; font-size: 12.5px; letter-spacing: .02em; }
    .seg.sm .thumb { top: 3px; bottom: 3px; }
    .seg.block { display: flex; width: 100%; }
    .seg.block button { flex: 1 0 auto; }

    .chip { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; color: var(--ink-2); background: var(--bg-sunken); border: 1px solid var(--line); }
    .pill { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--ink-3); border: 1px solid var(--line); white-space: nowrap; }
    .pill.next { color: var(--ink); background: color-mix(in oklab, var(--sun) 14%, transparent); border-color: color-mix(in oklab, var(--sun) 32%, transparent); }
    .pill.live { color: #fff; background: #C2453A; border-color: transparent; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sun); flex: none; }
    .dot.pulse { animation: pulse 2.4s var(--ease) infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--sun) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 9px transparent; } }

    /* Liste kabı (satırlar ince çizgilerle ayrılır) */
    .list { border-radius: var(--r-lg); background: var(--bg-elev); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
    /* <template> (Alpine x-for) elemanlarını atlayarak yalnızca satırlar arasına çizgi */
    .list > :not(template) + :not(template) { border-top: 1px solid var(--line); }

    /* ============================== Menü ============================== */
    .nav { position: fixed; z-index: 50; left: 0; right: 0; top: 0; padding: max(12px, env(safe-area-inset-top)) 12px 0; pointer-events: none; }
    .nav-bar {
      pointer-events: auto; position: relative;
      max-width: 1180px; height: 60px; margin: 0 auto;
      display: flex; align-items: center; gap: 8px; padding: 0 8px 0 20px;
      border-radius: 999px; border: 1px solid var(--line);
      background: color-mix(in oklab, var(--bg-elev) 72%, transparent);
      -webkit-backdrop-filter: saturate(1.8) blur(22px); backdrop-filter: saturate(1.8) blur(22px);
      box-shadow: var(--shadow);
      transition: box-shadow .5s var(--ease), background-color .5s var(--ease);
    }
    .nav.scrolled .nav-bar { box-shadow: var(--shadow-hover); }
    .brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; flex: none; }
    .brand b { font-family: var(--serif); font-weight: 400; font-size: 21px; letter-spacing: -.01em; }
    .brand small { font-size: 12.5px; color: var(--ink-3); }
    .nav-links { position: relative; display: none; gap: 2px; margin: 0 auto; }
    @media (min-width: 1120px) { .nav-links { display: flex; } }
    .nav-links a { position: relative; z-index: 1; padding: 8px 14px; border-radius: 999px; font-size: 14.5px; color: var(--ink-2); text-decoration: none; transition: color .3s var(--ease); }
    .nav-links a:hover, .nav-links a.active { color: var(--ink); }
    .nav-hover { position: absolute; z-index: 0; top: 50%; left: 0; height: 36px; margin-top: -18px; border-radius: 999px; background: var(--accent-soft); opacity: 0; transition: transform .5s var(--ease), width .5s var(--ease), opacity .35s var(--ease); }
    .nav-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    @media (min-width: 1120px) { .nav-actions { margin-left: 0; } .menu-btn { display: none !important; } }
    .nav-cta { display: none; }
    @media (min-width: 640px) { .nav-cta { display: inline-flex; } }
    .sheet {
      pointer-events: auto; max-width: 1180px; margin: 10px auto 0; padding: 10px;
      border-radius: var(--r-lg); border: 1px solid var(--line);
      background: color-mix(in oklab, var(--bg-elev) 92%, transparent);
      -webkit-backdrop-filter: saturate(1.8) blur(22px); backdrop-filter: saturate(1.8) blur(22px);
      box-shadow: var(--shadow-hover);
      max-height: calc(100dvh - 100px); overflow-y: auto;
    }
    .sheet a { display: flex; align-items: center; justify-content: space-between; padding: 15px 16px; border-radius: 18px; text-decoration: none; font-size: 17px; color: var(--ink); transition: background-color .3s var(--ease); }
    .sheet a:active, .sheet a:hover { background: var(--accent-soft); }
    .sheet a .ico { color: var(--ink-3); }
    .sheet .btn { width: 100%; margin-top: 8px; }

    /* Geçiş sınıfları (Alpine x-transition) */
    .t-fade { transition: opacity .45s var(--ease), transform .55s var(--ease); }
    .t-from { opacity: 0; transform: translateY(-8px) scale(.985); }
    .t-to { opacity: 1; transform: none; }
    .t-up-from { opacity: 0; transform: translateY(28px) scale(.985); }

    /* ============================== Hero ============================== */
    .hero { position: relative; overflow: hidden; padding: clamp(150px, 19vw, 210px) 0 clamp(72px, 9vw, 110px); }
    .hero .topo {
      inset: -6% -4% -6% -4%;
      -webkit-mask: url(assets/img/topo.svg) center / cover no-repeat, radial-gradient(ellipse 75% 70% at 70% 30%, #000 30%, transparent 80%);
      -webkit-mask-composite: source-in;
      mask: url(assets/img/topo.svg) center / cover no-repeat, radial-gradient(ellipse 75% 70% at 70% 30%, #000 30%, transparent 80%);
      mask-composite: intersect;
      will-change: transform;
    }
    .badge { display: inline-flex; align-items: center; gap: 10px; padding: 7px 16px 7px 12px; border-radius: 999px; font-size: 13.5px; color: var(--ink-2); background: var(--bg-elev); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .badge .sep { width: 1px; height: 12px; background: var(--line-strong); }
    .badge > span { white-space: nowrap; }
    @media (max-width: 480px) { .badge { font-size: 12.5px; gap: 8px; padding: 6px 12px 6px 10px; } }
    .kicker { margin: 44px 0 14px; font-size: 15px; color: var(--ink-3); letter-spacing: .01em; }
    .hero h1 {
      margin: 0; max-width: 15ch;
      font-family: var(--serif); font-weight: 300;
      font-size: clamp(2.9rem, 7.6vw, 6.8rem); line-height: .98; letter-spacing: -.035em;
      text-wrap: balance;
    }
    .hero h1 em { font-style: italic; color: var(--accent); white-space: nowrap; }
    @media (max-width: 640px) { .hero h1 { max-width: none; font-size: clamp(2.4rem, 11.2vw, 3.4rem); } }
    .hero-tr { margin: 26px 0 0; font-size: clamp(1.05rem, 1.7vw, 1.3rem); color: var(--ink-2); }
    .hero-grid { display: grid; gap: 18px; margin-top: 56px; }
    @media (min-width: 980px) { .hero-grid { grid-template-columns: 1fr 1fr; align-items: end; gap: 40px; } }
    .hero-lead { margin: 0; max-width: 48ch; color: var(--ink-2); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    @media (max-width: 520px) { .actions .btn { flex: 1 1 100%; } }

    .count { padding: 24px 26px 26px; }
    .count-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-size: 13.5px; color: var(--ink-3); }
    .units { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 18px; }
    .unit { padding-left: 18px; border-left: 1px solid var(--line); }
    .unit:first-child { padding-left: 0; border-left: 0; }
    .unit b { display: block; font-weight: 500; font-size: clamp(2.1rem, 4.6vw, 3.4rem); line-height: 1; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
    .unit span { display: block; margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }

    .facts { display: grid; margin-top: 18px; }
    @media (min-width: 760px) { .facts { grid-template-columns: repeat(3, 1fr); } .facts > :not(template) + :not(template) { border-top: 0; border-left: 1px solid var(--line); } }
    .fact { padding: 20px 24px; }
    .fact span { display: block; font-size: 12.5px; color: var(--ink-3); }
    .fact p { margin: 4px 0 0; font-size: 15.5px; font-weight: 500; line-height: 1.4; color: var(--ink); }

    /* ============================== Bölümler ============================== */
    .section { position: relative; padding: clamp(84px, 11vw, 140px) 0; }
    .section.tint { background: color-mix(in oklab, var(--bg-sunken) 55%, var(--bg)); }
    .head { display: grid; gap: 18px; margin-bottom: clamp(36px, 5vw, 56px); }
    @media (min-width: 900px) { .head { grid-template-columns: 1.15fr .85fr; align-items: end; gap: 48px; } }
    .eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 13.5px; color: var(--ink-3); }
    .eyebrow b { font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
    .eyebrow i { width: 22px; height: 1px; background: var(--line-strong); }
    .title { margin: 14px 0 0; font-family: var(--serif); font-weight: 400; font-size: clamp(2.15rem, 4.6vw, 3.6rem); line-height: 1.04; letter-spacing: -.025em; text-wrap: balance; }
    .title em { font-style: italic; color: var(--accent); }
    .lead { margin: 0; max-width: 46ch; color: var(--ink-2); }

    /* Hakkında */
    .about-grid { display: grid; gap: 16px; }
    @media (min-width: 980px) { .about-grid { grid-template-columns: 1.1fr .9fr; } }

<body x-data="symposiumApp()" x-init="init()" :class="{ locked: applyOpen || menuOpen }">

  <!-- ============================== MENÜ ============================== -->
  <header class="nav" :class="{ scrolled: scrolled }">
    <div class="nav-bar">
      <a href="#top" class="brand" aria-label="ECEP 2027">
        <b>ECEP</b><small class="num">2027</small>
      </a>

      <nav class="nav-links" x-ref="links" @mouseleave="hoverLink(null)" aria-label="Bölümler">
        <span class="nav-hover" :style="hoverStyle" aria-hidden="true"></span>
        <template x-for="link in primaryNav" :key="link.id">
          <a :href="'#' + link.id" :class="{ active: activeSection === link.id }" @mouseenter="hoverLink($event.target)" x-text="L(link.key)"></a>
        </template>
      </nav>

      <div class="nav-actions">
        <div class="seg sm" role="tablist" aria-label="Dil / Language" x-data="segmented()" x-effect="lang; $nextTick(() => update($el))">
          <span class="thumb" :style="thumb" aria-hidden="true"></span>
          <button type="button" role="tab" :aria-selected="lang === 'tr'" @click="setLang('tr')">TR</button>
          <button type="button" role="tab" :aria-selected="lang === 'en'" @click="setLang('en')">EN</button>
        </div>
        <button type="button" class="icon-btn" @click="toggleTheme($event)" :aria-label="L('a11y.theme')">
          <span class="ico" x-html="theme === 'dark' ? icon('sun') : icon('moon')"></span>
        </button>
        <button type="button" class="btn btn-primary sm nav-cta" x-show="phase === 'cfp'" @click="applyOpen = true">
          <span x-text="L('cta.apply')"></span>
        </button>
        <button type="button" class="icon-btn menu-btn" @click="menuOpen = !menuOpen" :aria-expanded="menuOpen" :aria-label="L('a11y.menu')">
          <span class="ico" x-html="menuOpen ? icon('close') : icon('menu')"></span>
        </button>
      </div>
    </div>

    <div class="sheet" x-show="menuOpen" x-cloak @click.outside="menuOpen = false" @keydown.escape.window="menuOpen = false"
         x-transition:enter="t-fade" x-transition:enter-start="t-from" x-transition:enter-end="t-to"
         x-transition:leave="t-fade" x-transition:leave-start="t-to" x-transition:leave-end="t-from">
      <template x-for="link in primaryNav.concat(secondaryNav)" :key="'m-' + link.id">
        <a :href="'#' + link.id" @click="menuOpen = false">
          <span x-text="L(link.key)"></span>
          <span class="ico" x-html="icon('arrow')"></span>
        </a>
      </template>
      <button type="button" class="btn btn-primary" x-show="phase === 'cfp'" @click="menuOpen = false; applyOpen = true" x-text="L('cta.apply')"></button>
    </div>
  </header>

  <main id="top">
    <!-- ============================== GİRİŞ ============================== -->
    <section class="hero">
      <div class="topo" x-ref="heroTopo" aria-hidden="true"></div>

        <div data-reveal>
          <span class="badge">
            <span class="dot pulse" aria-hidden="true"></span>
            <span class="num" x-text="phase === 'live' ? L('live.badge') : t(data.meta.dateRange)"></span>

            <span x-text="t(data.meta.city)"></span>

    // Kayan göstergeli sekme bileşeni
    function segmented() {
      return {
        thumb: 'opacity: 0',
        update(el) {
          const active = el.querySelector('[aria-selected="true"]');
          if (!active) return;
          this.thumb = 'width:' + active.offsetWidth + 'px; transform: translateX(' + active.offsetLeft + 'px)';
          if (el.scrollWidth > el.clientWidth) active.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
        },
        init() {
          const run = () => this.update(this.$el);
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
          window.addEventListener('resize', run, { passive: true });
        }
      };
    }

    // ---------------------------------------------------------------------
    // Alpine kök bileşeni
    // ---------------------------------------------------------------------
    function symposiumApp() {
      return {
        data: symposiumData,
        lang: 'tr',
        theme: document.documentElement.getAttribute('data-theme') || 'light',
        menuOpen: false,
        applyOpen: false,
        scrolled: false,
        activeSection: '',
        hoverStyle: 'opacity: 0',
        aboutTab: 'purpose',
        committeeTab: 'organizing',
        search: '',
        dayTab: 0,
        openFaq: 0,
        previewPhase: '',
        now: Date.now(),

        navItems: [
          { id: 'about', key: 'nav.about', primary: true },
          { id: 'themes', key: 'nav.themes', primary: true },
          { id: 'dates', key: 'nav.dates', primary: true },
          { id: 'committees', key: 'nav.committees', primary: true },
          { id: 'program', key: 'nav.program', primary: true },
          { id: 'venue', key: 'nav.venue', primary: true },
          { id: 'speakers', key: 'nav.speakers' },
          { id: 'news', key: 'nav.news' },
          { id: 'support', key: 'nav.support' },
          { id: 'faq', key: 'nav.faq' }
        ],
        committeeTabs: [
          { id: 'organizing', key: 'committees.organizing' },
          { id: 'scientific', key: 'committees.scientific' }
        ],

        init() {
          try {
            const saved = localStorage.getItem('ecep-lang');
            if (saved === 'tr' || saved === 'en') this.lang = saved;
            else if ((navigator.language || '').toLowerCase().startsWith('en')) this.lang = 'en';
          } catch (e) { /* depolama erişilemez */ }
          document.documentElement.lang = this.lang;

          const p = new URLSearchParams(location.search).get('phase');
          if (['cfp', 'live', 'archive'].includes(p)) this.previewPhase = p;
          if (this.phase === 'live') this.dayTab = this.liveDayIndex;

          setInterval(() => { this.now = Date.now(); }, 1000);

          // Sistem teması değişirse (kullanıcı seçim yapmadıysa) uy
          const mq = window.matchMedia('(prefers-color-scheme: dark)');
          mq.addEventListener && mq.addEventListener('change', (e) => {
            let saved = null;
            try { saved = localStorage.getItem('ecep-theme'); } catch (err) { /* yoksay */ }
            if (!saved) this.applyTheme(e.matches ? 'dark' : 'light', false);
          });

          // Kaydırma: menü gölgesi + girişteki dokuya hafif paralaks
          const topo = this.$refs.heroTopo;
          const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          let ticking = false;
          const onScroll = () => {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
              const y = window.scrollY;
              this.scrolled = y > 8;
              if (topo && !reduce && y < 1200) topo.style.transform = 'translate3d(0,' + (y * 0.18).toFixed(1) + 'px,0)';
              ticking = false;
            });
          };
          window.addEventListener('scroll', onScroll, { passive: true });
          onScroll();

          this.$nextTick(() => {
            // Görünümdeki bölümü menüde işaretle
            const sectionObs = new IntersectionObserver((entries) => {
              entries.forEach((en) => { if (en.isIntersecting) this.activeSection = en.target.id; });
            }, { rootMargin: '-45% 0px -50% 0px' });
            this.navItems.forEach((l) => { const el = document.getElementById(l.id); if (el) sectionObs.observe(el); });

            // Yumuşak beliriş
            const revealObs = new IntersectionObserver((entries) => {
              entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); revealObs.unobserve(en.target); } });
            }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
            document.querySelectorAll('[data-reveal]').forEach((el) => revealObs.observe(el));
          });
        },

        setLang(l) {
          this.lang = l;
          document.documentElement.lang = l;
          try { localStorage.setItem('ecep-lang', l); } catch (e) { /* yoksay */ }
        },

        applyTheme(next, persist = true) {
          this.theme = next;
          document.documentElement.setAttribute('data-theme', next);
          if (persist) { try { localStorage.setItem('ecep-theme', next); } catch (e) { /* yoksay */ } }
        },
        // Koyu/açık tema — tıklanan noktadan dairesel açılan geçiş
        toggleTheme(e) {
          const next = this.theme === 'dark' ? 'light' : 'dark';
          const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!document.startViewTransition || reduce) { this.applyTheme(next); return; }
          const x = e.clientX, y = e.clientY;
          const r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
          const tr = document.startViewTransition(() => this.applyTheme(next));
          tr.ready.then(() => {
            document.documentElement.animate(
              { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + r + 'px at ' + x + 'px ' + y + 'px)'] },
              { duration: 700, easing: 'cubic-bezier(.22,1,.36,1)', pseudoElement: '::view-transition-new(root)' }
            );
          });
        },

        // Menüde üzerine gelinen bağlantının arkasında kayan zemin
        hoverLink(el) {
          const target = el || (this.$refs.links && this.$refs.links.querySelector('a.active'));
          // Hedef yoksa son konumda kalarak solar (sonraki hover'da sıçrama olmaz)
          if (!target) { this.hoverStyle = this.hoverStyle.replace('opacity:1', 'opacity:0'); return; }
          this.hoverStyle = 'opacity:1; width:' + target.offsetWidth + 'px; transform: translateX(' + target.offsetLeft + 'px)';
        },

        t(v) {
          if (v && typeof v === 'object' && !Array.isArray(v)) return v[this.lang] ?? v.tr;
          return v;
        },
        L(key) { return uiText[this.lang][key] ?? key; },
        icon(name) {
          return '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
        },
        initials(name) {
          return name.split(/\s+/).filter((p) => p && !p.endsWith('.')).map((p) => p.charAt(0)).slice(0, 2).join('').toLocaleUpperCase('tr');
        },
        formatDate(iso, withWeekday = false) {
          const d = new Date(iso.length === 10 ? iso + 'T12:00:00+03:00' : iso);
          const opts = withWeekday
            ? { day: 'numeric', month: 'short', weekday: 'short', timeZone: 'Europe/Istanbul' }
            : { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Europe/Istanbul' };
          return new Intl.DateTimeFormat(this.lang === 'tr' ? 'tr-TR' : 'en-GB', opts).format(d);
        },
        norm(s) {
          return (s || '').toLocaleLowerCase('tr').replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, '');
        },

        // ---- Faz ----
        get phase() {
          const o = this.previewPhase || this.data.meta.phaseOverride;
          if (o) return o;
          if (this.now < new Date(this.data.meta.startDate).getTime()) return 'cfp';
          if (this.now <= new Date(this.data.meta.endDate).getTime()) return 'live';
          return 'archive';
        },

        get primaryNav() { return this.navItems.filter((l) => l.primary); },
        get secondaryNav() { return this.navItems.filter((l) => !l.primary); },

        // ---- Geri sayım ----
        get countdownUnits() {
          const s = Math.max(0, Math.floor((new Date(this.data.meta.startDate).getTime() - this.now) / 1000));
          const pad = (n) => String(n).padStart(2, '0');
          return [
            { key: 'cd.days', value: pad(Math.floor(s / 86400)) },
            { key: 'cd.hours', value: pad(Math.floor((s % 86400) / 3600)) },
            { key: 'cd.minutes', value: pad(Math.floor((s % 3600) / 60)) },
            { key: 'cd.seconds', value: pad(s % 60) }
          ];
        },

        // ---- Canlı mod ----
        get istanbulNow() {
          const parts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Europe/Istanbul', year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
          }).formatToParts(new Date(this.now));
          const g = (type) => parts.find((p) => p.type === type).value;
          return { date: g('year') + '-' + g('month') + '-' + g('day'), time: g('hour') + ':' + g('minute') };
        },
        get liveDayIndex() {
          const i = this.data.program.findIndex((d) => d.date === this.istanbulNow.date);
          return i < 0 ? 0 : i;
        },
        get isEventDay() { return this.data.program.some((d) => d.date === this.istanbulNow.date); },
        get liveNow() {
          if (!this.isEventDay) return [];
          const t = this.istanbulNow.time;
          return this.data.program[this.liveDayIndex].sessions.filter((s) => s.start <= t && t < s.end);
        },
        get liveNext() {
          const t = this.isEventDay ? this.istanbulNow.time : '00:00';
          return this.data.program[this.liveDayIndex].sessions.find((s) => s.start > t) || null;
        },
        isLiveSession(s) {
          return this.phase === 'live' && this.dayTab === this.liveDayIndex && this.liveNow.includes(s);
        },
        goToDay(i) {
          this.dayTab = i;
          document.getElementById('program').scrollIntoView({ behavior: 'smooth' });
        },

        // ---- Takvim ----
        get timeline() {
          let activeFound = false;
          // Tarihli bir madde geçtiyse, ondan önceki tarihsiz maddeler de tamamlanmış sayılır
          const lastDone = this.data.importantDates.reduce((acc, d, i) => (d.date && new Date(d.date).getTime() < this.now ? i : acc), -1);
          return this.data.importantDates.map((d, i) => {
            let status;
            if (i <= lastDone) status = 'done';
            else if (!activeFound) { status = 'active'; activeFound = true; }
            else status = 'upcoming';
            return { ...d, status };
          });
        },
        get timelineDone() { return this.timeline.filter((d) => d.status === 'done').length; },

        // ---- Kurul arama ----
        get committeeFiltered() {
          const list = this.data.committees[this.committeeTab];
          const q = this.norm(this.search.trim());
          if (!q) return list;
          return list.filter((m) => this.norm([m.title, m.name, this.t(m.affiliation), this.t(m.role)].join(' ')).includes(q));
        }
      };
    }
  </script>
