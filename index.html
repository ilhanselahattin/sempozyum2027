<!doctype html>
<html lang="tr" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISSDT 2027 · Uluslararası Sürdürülebilir Dijital Dönüşüm Sempozyumu</title>
  <meta name="description" content="ISSDT 2027 — 3. Uluslararası Sürdürülebilir Dijital Dönüşüm Sempozyumu, 13–14 Mayıs 2027, Ankara. Bildiri çağrısı, önemli tarihler, program ve kayıt bilgileri." />
  <meta name="theme-color" content="#0B0F19" />
  <!-- Alan adı kesinleşince SITE_URL değerlerini güncelleyin (canonical, og:url, og:image, JSON-LD) -->
  <link rel="canonical" href="https://sempozyum2027.example.edu.tr/" />

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

  <!-- Open Graph / sosyal medya önizlemesi (1200x630) -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="tr_TR" />
  <meta property="og:locale:alternate" content="en_GB" />
  <meta property="og:site_name" content="ISSDT 2027" />
  <meta property="og:title" content="ISSDT 2027 · Uluslararası Sürdürülebilir Dijital Dönüşüm Sempozyumu" />
  <meta property="og:description" content="13–14 Mayıs 2027 · Ankara. Bildiri çağrısı açık — özet gönderimi, önemli tarihler ve program." />
  <meta property="og:url" content="https://sempozyum2027.example.edu.tr/" />
  <meta property="og:image" content="https://sempozyum2027.example.edu.tr/assets/img/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="ISSDT 2027 sempozyum afişi" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ISSDT 2027 · Sustainable Digital Transformation Symposium" />
  <meta name="twitter:description" content="13–14 May 2027 · Ankara, Türkiye. Call for papers is open." />
  <meta name="twitter:image" content="https://sempozyum2027.example.edu.tr/assets/img/og-image.png" />

  <!-- Arama motorları için yapılandırılmış veri (schema.org Event) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Event",
    "name": "3. Uluslararası Sürdürülebilir Dijital Dönüşüm Sempozyumu (ISSDT 2027)",
    "alternateName": "3rd International Symposium on Sustainable Digital Transformation",
    "startDate": "2027-05-13T08:30:00+03:00",
    "endDate": "2027-05-14T16:30:00+03:00",
    "eventAttendanceMode": "https://schema.org/MixedEventAttendanceMode",
    "eventStatus": "https://schema.org/EventScheduled",
    "location": [
      {
        "@type": "Place",
        "name": "Kuzey Ufuk Üniversitesi Kongre ve Kültür Merkezi",
        "address": { "@type": "PostalAddress", "streetAddress": "Üniversiteler Mah. Bilim Cad. No: 12", "addressLocality": "Çankaya", "addressRegion": "Ankara", "postalCode": "06800", "addressCountry": "TR" }
      },
      { "@type": "VirtualLocation", "url": "https://sempozyum2027.example.edu.tr/#program" }
    ],
    "image": ["https://sempozyum2027.example.edu.tr/assets/img/og-image.png"],
    "description": "Yapay zekâ, veri bilimi, yeşil teknolojiler ve dijital toplum alanlarında hakemli uluslararası sempozyum.",
    "organizer": { "@type": "Organization", "name": "Kuzey Ufuk Üniversitesi", "url": "https://sempozyum2027.example.edu.tr/" },
    "inLanguage": ["tr", "en"]
  }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0B0F19',
            paper: '#F8FAFC',
            // Kurumsal vurgu rengi (Zümrüt) — değiştirmek için yalnızca bu paleti güncelleyin
            brand: {
              50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399',
              500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b'
            },
            // İkincil vurgu (Kehribar)
            accent: {
              50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24',
              500: '#f59e0b', 600: '#D97706', 700: '#b45309', 800: '#92400e', 900: '#78350f'
            }
          },
          fontFamily: {
            display: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          }
        }
      }
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .card { @apply rounded-2xl border border-slate-200 bg-white transition duration-300 ease-out hover:-translate-y-1 hover:border-brand-600; }
      .card-dark { @apply rounded-2xl border border-white/10 bg-white/[0.03] transition duration-300 ease-out hover:-translate-y-1 hover:border-brand-500; }
      .eyebrow { @apply inline-flex items-center gap-2 font-mono text-xs font-medium uppercase tracking-[0.18em] text-brand-700; }
      .section-title { @apply font-display text-3xl font-bold tracking-tight text-ink sm:text-4xl lg:text-5xl; }
      .btn-primary { @apply inline-flex items-center justify-center gap-2 rounded-full bg-brand-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-brand-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600 focus-visible:ring-offset-2; }
      .btn-ghost { @apply inline-flex items-center justify-center gap-2 rounded-full border border-slate-300 bg-white px-6 py-3 text-sm font-semibold text-ink transition hover:border-ink focus:outline-none focus-visible:ring-2 focus-visible:ring-ink focus-visible:ring-offset-2; }
      .tab { @apply relative whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600; }
      .chip { @apply rounded-full border border-slate-200 bg-paper px-2.5 py-1 text-xs text-slate-600; }
      .search-input { @apply w-full rounded-full border border-slate-200 bg-paper py-2.5 pl-10 pr-4 text-sm text-ink placeholder:text-slate-400 focus:border-brand-600 focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand-600/10; }
    }
  </style>
  <style>
    [x-cloak] { display: none !important; }
    html { scroll-padding-top: 88px; }
    body { background-color: #F8FAFC; }
    .tabular { font-variant-numeric: tabular-nums; }
    /* Silik arka plan desenleri */
    .bg-grid {
      background-image:
        linear-gradient(to right, rgba(15, 23, 42, .045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, .045) 1px, transparent 1px);
      background-size: 56px 56px;
    }
    .bg-dots { background-image: radial-gradient(rgba(15, 23, 42, .09) 1px, transparent 1px); background-size: 22px 22px; }
    .bg-dots-dark { background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px); background-size: 22px 22px; }
    .mask-fade { -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, #000 40%, transparent 100%); mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, #000 40%, transparent 100%); }
    .mask-fade-b { -webkit-mask-image: linear-gradient(to bottom, #000 50%, transparent); mask-image: linear-gradient(to bottom, #000 50%, transparent); }
    @keyframes ping-soft { 0% { transform: scale(1); opacity: .55; } 80%, 100% { transform: scale(2.4); opacity: 0; } }
    .ping-soft { animation: ping-soft 1.8s cubic-bezier(0, 0, .2, 1) infinite; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .ping-soft { animation: none; }
      *, *::before, *::after { transition-duration: 0ms !important; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
  </style>

  <!-- Lucide Icons (Alpine'den önce yüklenmeli) -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Alpine.js (Collapse eklentisi çekirdekten önce yüklenmeli) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.8/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>

<body x-data="symposiumApp()" x-init="init()"
      x-effect="document.body.classList.toggle('overflow-hidden', kvkkOpen || lightbox !== null)"
      class="font-sans text-slate-700 antialiased selection:bg-brand-100 selection:text-brand-900">

  <a href="#top" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[70] focus:rounded-full focus:bg-ink focus:px-4 focus:py-2 focus:text-white" x-text="L('a11y.skip')"></a>

  <!-- ============================== DUYURU ŞERİDİ ============================== -->
  <div x-show="announcementVisible" x-cloak class="relative z-50 bg-accent-600 text-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-2 text-sm sm:px-6 lg:px-8">
      <a :href="data.announcement.href" class="flex min-w-0 items-center gap-2 font-medium hover:underline">
        <span class="shrink-0" x-html="icon('megaphone', 'h-4 w-4')"></span>
        <span class="truncate" x-text="t(data.announcement.text)"></span>
      </a>
      <button type="button" @click="dismissAnnouncement()" class="grid h-7 w-7 shrink-0 place-items-center rounded-full hover:bg-white/15" :aria-label="L('a11y.close')">
        <span x-html="icon('x', 'h-4 w-4')"></span>
      </button>
    </div>
  </div>

  <!-- ============================== NAVBAR ============================== -->
  <header class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/80 backdrop-blur-md">
    <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8" aria-label="Ana menü">
      <!-- Logo -->
      <a href="#top" class="flex shrink-0 items-center gap-3" aria-label="Ana sayfa">
        <template x-if="data.meta.logo">
          <img :src="data.meta.logo" :alt="data.meta.acronym" class="h-9 w-auto" />
        </template>
        <template x-if="!data.meta.logo">
          <span class="grid h-9 w-9 place-items-center rounded-lg bg-ink font-display text-sm font-extrabold text-white" x-text="data.meta.monogram"></span>
        </template>
        <span class="leading-tight">
          <span class="block font-display text-sm font-bold text-ink" x-text="data.meta.acronym"></span>
          <span class="hidden font-mono text-[10px] uppercase tracking-widest text-slate-500 sm:block" x-text="t(data.meta.shortDate)"></span>
        </span>
      </a>

      <!-- Masaüstü linkler -->
      <ul class="hidden items-center gap-0.5 xl:flex">
        <template x-for="link in primaryNav" :key="link.id">
          <li>
            <a :href="'#' + link.id"
               class="rounded-full px-3 py-2 text-sm font-medium transition"
               :class="activeSection === link.id ? 'bg-slate-100 text-ink' : 'text-slate-600 hover:text-ink'"
               x-text="L(link.key)"></a>
          </li>
        </template>
        <li x-data="{ more: false }" class="relative" @click.outside="more = false" @keydown.escape="more = false">
          <button type="button" @click="more = !more" :aria-expanded="more"
                  class="inline-flex items-center gap-1 rounded-full px-3 py-2 text-sm font-medium transition"
                  :class="secondaryNav.some(l => l.id === activeSection) ? 'bg-slate-100 text-ink' : 'text-slate-600 hover:text-ink'">
            <span x-text="L('nav.more')"></span>
            <span class="transition" :class="more && 'rotate-180'" x-html="icon('chevron-down', 'h-3.5 w-3.5')"></span>
          </button>
          <div x-show="more" x-cloak x-transition.origin.top.duration.150ms class="absolute right-0 top-full mt-2 w-56 rounded-2xl border border-slate-200 bg-white p-1.5">
            <template x-for="link in secondaryNav" :key="link.id">
              <a :href="'#' + link.id" @click="more = false"
                 class="flex items-center gap-2.5 rounded-xl px-3 py-2 text-sm transition"
                 :class="activeSection === link.id ? 'bg-slate-100 text-ink' : 'text-slate-600 hover:bg-slate-50 hover:text-ink'">
                <span class="text-slate-400" x-html="icon(link.icon, 'h-4 w-4')"></span>
                <span x-text="L(link.key)"></span>
              </a>
            </template>
          </div>
        </li>
      </ul>

      <div class="flex items-center gap-2">
        <!-- Dil anahtarı -->
        <div class="flex items-center rounded-full border border-slate-200 bg-white p-0.5 font-mono text-xs font-semibold" role="group" aria-label="Dil / Language">
          <button type="button" @click="setLang('tr')" class="rounded-full px-2.5 py-1 transition" :class="lang === 'tr' ? 'bg-ink text-white' : 'text-slate-500 hover:text-ink'" :aria-pressed="lang === 'tr'">TR</button>
          <button type="button" @click="setLang('en')" class="rounded-full px-2.5 py-1 transition" :class="lang === 'en' ? 'bg-ink text-white' : 'text-slate-500 hover:text-ink'" :aria-pressed="lang === 'en'">EN</button>
        </div>
        <!-- CTA (faza göre değişir) -->
        <a :href="cta.href" :target="cta.external ? '_blank' : null" :rel="cta.external ? 'noopener' : null"
           class="hidden items-center gap-2 rounded-full px-4 py-2 text-sm font-semibold text-white transition sm:inline-flex"
           :class="phase === 'live' ? 'bg-rose-600 hover:bg-rose-700' : 'bg-brand-600 hover:bg-brand-700'">
          <span x-text="L(cta.key)"></span>
          <span x-html="icon(cta.icon, 'h-4 w-4')"></span>
        </a>
        <!-- Mobil menü butonu -->
        <button type="button" @click="mobileMenu = !mobileMenu" class="grid h-9 w-9 place-items-center rounded-full border border-slate-200 bg-white text-ink xl:hidden" :aria-expanded="mobileMenu" :aria-label="L('a11y.menu')">
          <span x-show="!mobileMenu" x-html="icon('menu', 'h-4 w-4')"></span>
          <span x-show="mobileMenu" x-cloak x-html="icon('x', 'h-4 w-4')"></span>
        </button>
      </div>
    </nav>

    <!-- Mobil menü -->
    <div x-show="mobileMenu" x-cloak x-transition.opacity.duration.200ms @click.outside="mobileMenu = false" class="max-h-[calc(100vh-4rem)] overflow-y-auto border-t border-slate-200 bg-white/95 backdrop-blur-md xl:hidden">
      <ul class="mx-auto grid max-w-7xl gap-1 px-4 py-4 sm:grid-cols-2 sm:px-6">
        <template x-for="link in primaryNav.concat(secondaryNav)" :key="link.id">
          <li>
            <a :href="'#' + link.id" @click="mobileMenu = false" class="flex items-center gap-3 rounded-xl px-3 py-3 text-base font-medium text-ink hover:bg-slate-100">
              <span class="text-slate-400" x-html="icon(link.icon, 'h-4 w-4')"></span>
              <span x-text="L(link.key)"></span>
            </a>
          </li>
        </template>
        <li class="pt-2 sm:col-span-2">
          <a :href="cta.href" :target="cta.external ? '_blank' : null" :rel="cta.external ? 'noopener' : null" class="btn-primary w-full">
            <span x-text="L(cta.key)"></span>
            <span x-html="icon(cta.icon, 'h-4 w-4')"></span>
          </a>
        </li>
      </ul>
    </div>
  </header>

  <main id="top">
    <!-- ============================== HERO ============================== -->
    <section class="relative overflow-hidden border-b border-slate-200">
      <div class="pointer-events-none absolute inset-0 bg-grid mask-fade" aria-hidden="true"></div>
      <div class="relative mx-auto max-w-7xl px-4 pb-16 pt-14 sm:px-6 sm:pt-20 lg:px-8 lg:pb-24 lg:pt-28">
        <!-- Rozetler -->
        <div class="flex flex-wrap items-center gap-2">
          <span class="inline-flex items-center gap-2 rounded-full border bg-white px-3 py-1.5 text-xs font-medium text-ink"
                :class="phase === 'live' ? 'border-rose-200' : 'border-slate-200'">
            <span class="relative flex h-2 w-2">
              <span class="ping-soft absolute inline-flex h-full w-full rounded-full" :class="phase === 'live' ? 'bg-rose-500' : 'bg-brand-500'"></span>
              <span class="relative inline-flex h-2 w-2 rounded-full" :class="phase === 'live' ? 'bg-rose-600' : 'bg-brand-600'"></span>
            </span>
            <template x-if="phase === 'live'">
              <span class="font-mono font-semibold uppercase tracking-[0.14em] text-rose-700" x-text="L('live.badge') + ' · ' + L('program.day') + ' ' + (liveDayIndex + 1)"></span>
            </template>
            <template x-if="phase !== 'live'">
              <span class="font-mono tabular" x-text="t(data.meta.dateRange)"></span>
            </template>
            <span class="text-slate-300">/</span>
            <span x-text="t(data.meta.city)"></span>
          </span>
          <span class="inline-flex items-center gap-1.5 rounded-full border border-accent-200 bg-accent-50 px-3 py-1.5 text-xs font-medium text-accent-800">
            <span x-html="icon('sparkles', 'h-3.5 w-3.5')"></span>
            <span x-text="t(data.meta.edition)"></span>
          </span>
          <span x-show="phase === 'archive'" x-cloak class="inline-flex items-center gap-1.5 rounded-full bg-ink px-3 py-1.5 text-xs font-medium text-white">
            <span x-html="icon('archive', 'h-3.5 w-3.5')"></span>
            <span x-text="L('archive.badge')"></span>
          </span>
        </div>

        <!-- Başlık -->
        <h1 class="mt-8 max-w-5xl font-display text-4xl font-extrabold leading-[1.04] tracking-tight text-ink sm:text-6xl lg:text-7xl">
          <span x-text="t(data.meta.titleLead)"></span>
          <span class="text-brand-600" x-text="t(data.meta.titleAccent)"></span>
        </h1>
        <p class="mt-6 max-w-2xl text-lg leading-relaxed text-slate-600"
           x-text="phase === 'archive' ? t(data.archive.thanks) : t(data.meta.tagline)"></p>

        <!-- Butonlar: Çağrı dönemi -->
        <div x-show="phase === 'cfp'" class="mt-10 flex flex-col gap-3 sm:flex-row">
          <a :href="cta.href" :target="cta.external ? '_blank' : null" :rel="cta.external ? 'noopener' : null" class="btn-primary">
            <span x-html="icon(cta.icon, 'h-4 w-4')"></span>
            <span x-text="L(cta.key === 'cta.abstract' ? 'cta.paper' : cta.key)"></span>
          </a>
          <a :href="data.downloads[0].href" download class="btn-ghost">
            <span x-html="icon('file-down', 'h-4 w-4')"></span>
            <span x-text="L('cta.template')"></span>
          </a>
        </div>

        <!-- Butonlar: Canlı mod -->
        <div x-show="phase === 'live'" x-cloak class="mt-10 flex flex-col gap-3 sm:flex-row">
          <button type="button" @click="goToDay(liveDayIndex)" class="btn-primary bg-rose-600 hover:bg-rose-700 focus-visible:ring-rose-600">
            <span x-html="icon('radio', 'h-4 w-4')"></span>
            <span x-text="L('live.dayProgram').replace('{n}', liveDayIndex + 1)"></span>
          </button>
          <a :href="data.meta.programPdf" download class="btn-ghost">
            <span x-html="icon('file-down', 'h-4 w-4')"></span>
            <span x-text="L('live.pdf')"></span>
          </a>
        </div>

        <!-- Butonlar: Arşiv modu (bildiri kitapları en büyük buton) -->
        <div x-show="phase === 'archive'" x-cloak class="mt-10 grid gap-3 sm:grid-cols-2 lg:max-w-4xl">
          <template x-for="(book, bi) in data.proceedings" :key="book.isbn">
            <a :href="book.url" download class="group flex items-center gap-4 rounded-2xl p-5 transition hover:-translate-y-1"
               :class="bi === 0 ? 'bg-brand-600 text-white hover:bg-brand-700' : 'border border-slate-200 bg-white text-ink hover:border-brand-600'">
              <span class="grid h-12 w-12 shrink-0 place-items-center rounded-xl" :class="bi === 0 ? 'bg-white/15' : 'bg-brand-50 text-brand-700'" x-html="icon('book-down', 'h-6 w-6')"></span>
              <span class="min-w-0">
                <span class="block font-display text-lg font-bold" x-text="L('archive.download') + ' ' + t(book.title)"></span>
                <span class="block font-mono text-xs tabular" :class="bi === 0 ? 'text-brand-100' : 'text-slate-500'" x-text="'ISBN: ' + book.isbn + ' · ' + book.size"></span>
              </span>
            </a>
          </template>
        </div>

        <!-- Alt panel -->
        <div class="mt-14 grid gap-4 lg:grid-cols-12">
          <!-- Geri sayım (çağrı dönemi) -->
          <div x-show="phase === 'cfp'" class="relative overflow-hidden rounded-2xl bg-ink p-6 text-white sm:p-8 lg:col-span-8">
            <div class="pointer-events-none absolute inset-0 bg-dots-dark" aria-hidden="true"></div>
            <div class="relative flex flex-col gap-6 sm:flex-row sm:items-end sm:justify-between">
              <div>
                <p class="font-mono text-xs uppercase tracking-[0.2em] text-brand-400" x-text="L('countdown.label')"></p>
                <p class="mt-1 text-sm text-slate-400" x-text="t(data.meta.openingNote)"></p>
              </div>
              <span class="hidden font-mono text-xs text-slate-500 sm:block">UTC+03:00</span>
            </div>
            <div class="relative mt-6 grid grid-cols-4 gap-2 sm:gap-4" role="timer" aria-live="off">
              <template x-for="unit in countdownUnits" :key="unit.key">
                <div class="rounded-xl border border-white/10 bg-white/[0.04] px-2 py-4 text-center sm:px-4 sm:py-5">
                  <div class="font-mono text-3xl font-semibold tabular text-white sm:text-5xl lg:text-6xl" x-text="unit.value"></div>
                  <div class="mt-2 font-mono text-[10px] uppercase tracking-[0.18em] text-slate-400 sm:text-xs" x-text="L(unit.key)"></div>
                </div>
              </template>
            </div>
          </div>

          <!-- Şu an / sıradaki (canlı mod) -->
          <div x-show="phase === 'live'" x-cloak class="relative overflow-hidden rounded-2xl bg-ink p-6 text-white sm:p-8 lg:col-span-8">
            <div class="pointer-events-none absolute inset-0 bg-dots-dark" aria-hidden="true"></div>
            <div class="relative flex items-center justify-between">
              <p class="font-mono text-xs uppercase tracking-[0.2em] text-rose-400" x-text="L('live.now')"></p>
              <span class="font-mono text-sm tabular text-slate-300" x-text="istanbulNow.time + ' TSİ'"></span>
            </div>
            <div class="relative mt-5 space-y-3">
              <template x-for="(s, si) in liveNow" :key="'now-' + si">
                <div class="rounded-xl border border-rose-500/40 bg-rose-500/10 p-4">
                  <p class="font-mono text-xs tabular text-rose-300" x-text="s.start + '–' + s.end + (s.hall ? ' · ' + t(s.hall) : '')"></p>
                  <p class="mt-1 font-display font-semibold" x-text="t(s.title)"></p>
                  <a x-show="hallLink(s)" :href="hallLink(s)" target="_blank" rel="noopener" class="mt-2 inline-flex items-center gap-1.5 text-xs font-semibold text-rose-300 hover:text-white">
                    <span x-html="icon('video', 'h-3.5 w-3.5')"></span><span x-text="L('program.joinOnline')"></span>
                  </a>
                </div>
              </template>
              <p x-show="liveNow.length === 0" class="text-sm text-slate-400" x-text="L('live.nothingNow')"></p>
              <template x-if="liveNext">
                <div class="rounded-xl border border-white/10 bg-white/[0.04] p-4">
                  <p class="font-mono text-[10px] uppercase tracking-[0.16em] text-slate-400" x-text="L('live.next')"></p>
                  <p class="mt-1 font-mono text-xs tabular text-slate-300" x-text="liveNext.start + '–' + liveNext.end + (liveNext.hall ? ' · ' + t(liveNext.hall) : '')"></p>
                  <p class="mt-1 font-display font-semibold" x-text="t(liveNext.title)"></p>
                </div>
              </template>
            </div>
          </div>

          <!-- Sertifika & özet (arşiv modu) -->
          <div x-show="phase === 'archive'" x-cloak class="relative overflow-hidden rounded-2xl bg-ink p-6 text-white sm:p-8 lg:col-span-8">
            <div class="pointer-events-none absolute inset-0 bg-dots-dark" aria-hidden="true"></div>
            <div class="relative grid gap-6 sm:grid-cols-2">
              <div>
                <span class="grid h-11 w-11 place-items-center rounded-xl border border-white/10 bg-white/5 text-brand-400" x-html="icon('award', 'h-5 w-5')"></span>
                <h2 class="mt-4 font-display text-xl font-bold" x-text="L('archive.certTitle')"></h2>
                <p class="mt-2 text-sm leading-relaxed text-slate-400" x-text="t(data.certificates.note)"></p>
                <a :href="data.certificates.url" target="_blank" rel="noopener" class="mt-5 inline-flex items-center gap-2 rounded-full bg-white px-5 py-2.5 text-sm font-semibold text-ink transition hover:bg-brand-50">
                  <span x-html="icon('download', 'h-4 w-4')"></span><span x-text="L('archive.certButton')"></span>
                </a>
              </div>
              <dl class="grid grid-cols-2 gap-px self-start overflow-hidden rounded-xl border border-white/10 bg-white/10">
                <template x-for="st in data.archive.stats" :key="st.value">
                  <div class="bg-ink p-4">
                    <dt class="font-mono text-[10px] uppercase tracking-[0.16em] text-slate-400" x-text="t(st.label)"></dt>
                    <dd class="mt-1 font-mono text-2xl font-semibold tabular" x-text="st.value"></dd>
                  </div>
                </template>
              </dl>
            </div>
          </div>

          <!-- Kısa bilgiler -->
          <div class="grid grid-cols-1 gap-4 min-[420px]:grid-cols-2 lg:col-span-4 lg:grid-cols-1">
            <template x-for="fact in data.meta.facts" :key="fact.icon">
              <div class="card flex items-start gap-3 p-4 sm:p-5">
                <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-brand-50 text-brand-700" x-html="icon(fact.icon, 'h-4 w-4')"></span>
                <div class="min-w-0">
                  <p class="font-mono text-[10px] uppercase tracking-[0.16em] text-slate-500" x-text="t(fact.label)"></p>
                  <p class="mt-0.5 text-sm font-semibold text-ink" x-text="t(fact.value)"></p>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================== HAKKINDA & KONULAR ============================== -->
    <section id="about" class="relative py-20 sm:py-28">

          </div>
          <p class="max-w-md text-slate-600" x-text="L('about.lead')"></p>
        </div>

        <!-- Bento Grid -->
        <div class="mt-12 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-12">

          <article class="relative overflow-hidden rounded-2xl bg-ink p-8 text-white sm:col-span-2 lg:col-span-6 lg:row-span-2">
            <div class="pointer-events-none absolute inset-0 bg-dots-dark mask-fade-b" aria-hidden="true"></div>
            <div class="relative flex h-full flex-col">
              <span class="grid h-11 w-11 place-items-center rounded-xl border border-white/10 bg-white/5 text-brand-400" x-html="icon('target', 'h-5 w-5')"></span>
              <h3 class="mt-6 font-display text-2xl font-bold sm:text-3xl" x-text="t(data.about.title)"></h3>
              <div class="mt-4 space-y-4 text-slate-300">

                    <dt class="font-mono text-[10px] uppercase tracking-[0.16em] text-slate-400" x-text="L(stat.key)"></dt>
                    <dd class="mt-1 font-mono text-2xl font-semibold tabular text-white" x-text="stat.value"></dd>
                  </div>
                </template>
              </dl>
            </div>
          </article>

          <!-- Konu kutuları -->
          <template x-for="(track, i) in data.tracks" :key="track.id">

                <span class="grid h-11 w-11 place-items-center rounded-xl border border-slate-200 bg-paper text-ink transition group-hover:border-brand-600 group-hover:bg-brand-600 group-hover:text-white" x-html="icon(track.icon, 'h-5 w-5')"></span>

              <h3 class="mt-5 font-display text-lg font-bold text-ink" :class="track.featured && 'sm:text-xl'" x-text="t(track.title)"></h3>

              <ul x-show="track.featured" class="mt-auto flex flex-wrap gap-2 pt-5">
                <template x-for="kw in (t(track.keywords) || [])" :key="kw">

                </template>

          <!-- Yayın kartı -->

            <div class="flex items-center gap-3">
              <span class="grid h-11 w-11 place-items-center rounded-xl bg-accent-600 text-white" x-html="icon('book-open-check', 'h-5 w-5')"></span>
              <p class="font-mono text-xs uppercase tracking-[0.16em] text-accent-800" x-text="L('about.publication')"></p>
            </div>
            <p class="text-sm leading-relaxed text-accent-900" x-text="t(data.about.publication)"></p>

          <!-- Akademik Teşvik & Doçentlik kartı -->

            <div class="grid gap-8 lg:grid-cols-12 lg:items-center">
              <div class="lg:col-span-5">
                <div class="flex items-center gap-3">
                  <span class="grid h-11 w-11 place-items-center rounded-xl bg-ink text-white" x-html="icon('badge-check', 'h-5 w-5')"></span>
                  <p class="font-mono text-xs uppercase tracking-[0.16em] text-brand-700" x-text="L('incentive.eyebrow')"></p>
                </div>
                <h3 class="mt-5 font-display text-2xl font-bold text-ink" x-text="t(data.incentive.title)"></h3>
                <p class="mt-3 text-sm leading-relaxed text-slate-600" x-text="t(data.incentive.text)"></p>
                <p class="mt-4 flex gap-2 text-xs leading-relaxed text-slate-500">
                  <span class="mt-0.5 shrink-0" x-html="icon('info', 'h-3.5 w-3.5')"></span>
                  <span x-text="t(data.incentive.disclaimer)"></span>

              <ul class="grid gap-3 sm:grid-cols-2 lg:col-span-7">
                <template x-for="f in incentiveFacts" :key="f.key">
                  <li class="flex items-start gap-3 rounded-xl border border-slate-200 bg-paper p-4">
                    <span class="mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-full bg-brand-600 text-white" x-html="icon('check', 'h-3.5 w-3.5')"></span>
                    <span>
                      <span class="block font-mono text-lg font-semibold tabular text-ink" x-text="f.value"></span>
                      <span class="block text-sm text-slate-600" x-text="L(f.key)"></span>
                    </span>
                  </li>
                </template>
              </ul>
            </div>
          </article>
        </div>
      </div>
    </section>

    <!-- ============================== ÖNEMLİ TARİHLER ============================== -->
    <section id="dates" class="relative overflow-hidden bg-ink py-20 text-white sm:py-28">
      <div class="pointer-events-none absolute inset-0 bg-dots-dark" aria-hidden="true"></div>
      <div class="relative mx-auto grid max-w-7xl gap-12 px-4 sm:px-6 lg:grid-cols-12 lg:px-8">
        <div class="lg:col-span-4">
          <div class="lg:sticky lg:top-28">
            <span class="eyebrow text-brand-400"><span class="h-px w-6 bg-brand-400"></span><span x-text="L('dates.eyebrow')"></span></span>
            <h2 class="mt-4 font-display text-3xl font-bold tracking-tight sm:text-4xl lg:text-5xl" x-text="L('dates.title')"></h2>
            <p class="mt-4 text-slate-400" x-text="L('dates.lead')"></p>

            <!-- İlerleme -->
            <div class="mt-8 rounded-2xl border border-white/10 bg-white/[0.03] p-5">
              <div class="flex items-center justify-between font-mono text-xs uppercase tracking-[0.16em] text-slate-400">
                <span x-text="L('dates.progress')"></span>
                <span class="tabular text-white" x-text="timelineDone + ' / ' + timeline.length"></span>
              </div>
              <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-white/10">
                <div class="h-full rounded-full bg-brand-500 transition-all duration-700" :style="'width:' + (timelineDone / timeline.length * 100) + '%'"></div>
              </div>
              <template x-if="activeDate">
                <p class="mt-4 text-sm text-slate-300">
                  <span x-text="L('dates.next')"></span>
                  <span class="font-semibold text-white" x-text="t(activeDate.title)"></span>
                  —
                  <span class="font-mono tabular text-brand-400" x-text="activeDate.daysLeft + ' ' + L('dates.daysLeft')"></span>
                </p>
              </template>
            </div>
          </div>
        </div>

        <!-- Zaman çizelgesi -->
        <ol class="relative lg:col-span-8">
          <li class="absolute bottom-3 left-[15px] top-3 w-px bg-white/10" aria-hidden="true"></li>
          <template x-for="(item, i) in timeline" :key="item.key">
            <li class="relative pb-6 pl-12 last:pb-0">
              <!-- Düğüm -->
              <span class="absolute left-0 top-5 grid h-[31px] w-[31px] place-items-center rounded-full border"
                    :class="{
                      'border-white/15 bg-ink text-slate-500': item.status === 'done',
                      'border-brand-500 bg-brand-600 text-white shadow-[0_0_0_6px_rgba(5,150,105,0.18)]': item.status === 'active',
                      'border-white/20 bg-ink text-slate-300': item.status === 'upcoming'
                    }">
                <span x-show="item.status === 'done'" x-html="icon('check', 'h-3.5 w-3.5')"></span>
                <span x-show="item.status === 'active'" class="relative flex h-2 w-2">
                  <span class="ping-soft absolute inline-flex h-full w-full rounded-full bg-white"></span>
                  <span class="relative inline-flex h-2 w-2 rounded-full bg-white"></span>
                </span>
                <span x-show="item.status === 'upcoming'" class="font-mono text-[10px] tabular" x-text="String(i + 1).padStart(2, '0')"></span>
              </span>

              <!-- Kart -->
              <div class="rounded-2xl border p-5 transition duration-300 sm:p-6"
                   :class="{
                     'border-white/5 bg-white/[0.015] opacity-50 hover:opacity-80': item.status === 'done',
                     'border-brand-500/60 bg-brand-500/[0.08] shadow-[0_0_40px_-12px_rgba(16,185,129,0.55)]': item.status === 'active',
                     'border-white/10 bg-white/[0.03] hover:-translate-y-1 hover:border-brand-500': item.status === 'upcoming'
                   }">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                    <!-- Uzatıldıysa eski tarih üstü çizili -->
                    <del x-show="item.isExtended && item.oldDate" class="font-mono text-sm tabular text-slate-500 decoration-accent-500 decoration-2" x-text="formatDate(item.oldDate || item.date)"></del>
                    <time class="font-mono text-sm font-medium tabular" :class="item.status === 'active' ? 'text-brand-300' : 'text-slate-300'" :datetime="item.date" x-text="formatDate(item.date)"></time>
                    <span x-show="item.isExtended" class="inline-flex items-center gap-1 rounded-full bg-accent-500 px-2 py-0.5 font-mono text-[10px] font-bold uppercase tracking-[0.12em] text-ink">
                      <span x-html="icon('calendar-clock', 'h-3 w-3')"></span><span x-text="L('dates.extended')"></span>
                    </span>
                  </div>
                  <span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 font-mono text-[10px] font-semibold uppercase tracking-[0.14em]"
                        :class="{
                          'bg-white/5 text-slate-400': item.status === 'done',
                          'bg-brand-500 text-ink': item.status === 'active',
                          'border border-white/10 text-slate-400': item.status === 'upcoming'
                        }"
                        x-text="L('status.' + item.status)"></span>
                </div>
                <h3 class="mt-3 font-display text-lg font-bold text-white sm:text-xl" :class="item.status === 'done' && 'line-through decoration-white/30'" x-text="t(item.title)"></h3>
                <p class="mt-1.5 text-sm leading-relaxed text-slate-400" x-text="t(item.desc)"></p>
                <p x-show="item.status === 'active'" class="mt-4 inline-flex items-center gap-2 font-mono text-xs text-brand-300">
                  <span x-html="icon('hourglass', 'h-3.5 w-3.5')"></span>
                  <span class="tabular" x-text="item.daysLeft + ' ' + L('dates.daysLeft')"></span>
                </p>
              </div>
            </li>
          </template>
        </ol>
      </div>
    </section>

    <!-- ============================== DAVETLİ KONUŞMACILAR ============================== -->
    <section id="speakers" class="py-20 sm:py-28">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
          <div class="max-w-2xl">
            <span class="eyebrow"><span class="h-px w-6 bg-brand-600"></span><span x-text="L('speakers.eyebrow')"></span></span>
            <h2 class="section-title mt-4" x-text="L('speakers.title')"></h2>
          </div>
          <p class="max-w-md text-slate-600" x-text="L('speakers.lead')"></p>
        </div>

        <div class="mt-12 grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">
          <template x-for="sp in data.speakers" :key="sp.name">
            <article x-data="{ open: false }" @mouseenter="open = true" @mouseleave="open = false" @focusin="open = true" @focusout="open = false"
                     class="group relative overflow-hidden rounded-2xl border border-slate-200 bg-white transition duration-300 hover:-translate-y-1 hover:border-brand-600">
              <!-- Portre -->
              <div class="relative aspect-[3/4] overflow-hidden bg-ink">
                <template x-if="sp.photo">
                  <img :src="sp.photo" :alt="sp.name" loading="lazy" class="h-full w-full object-cover grayscale transition duration-500 group-hover:scale-105 group-hover:grayscale-0" />
                </template>
                <template x-if="!sp.photo">
                  <div class="absolute inset-0 transition duration-500 group-hover:scale-105">
                    <div class="absolute inset-0 bg-dots-dark"></div>
                    <div class="absolute -right-10 -top-10 h-48 w-48 rounded-full border border-white/10"></div>
                    <div class="absolute -right-2 -top-2 h-32 w-32 rounded-full border border-white/10"></div>
                    <div class="absolute inset-0 grid place-items-center">
                      <span class="font-display text-7xl font-extrabold tracking-tighter text-white/90" x-text="initials(sp.name)"></span>

                <span class="absolute left-4 top-4 rounded-full bg-white/90 px-2.5 py-1 font-mono text-[10px] font-semibold uppercase tracking-[0.14em] text-ink backdrop-blur" x-text="L('program.day') + ' ' + sp.day"></span>

                <!-- Hover detay -->
                <div class="absolute inset-x-0 bottom-0 translate-y-full bg-gradient-to-t from-ink via-ink/95 to-ink/80 p-5 text-white transition duration-500 ease-out"
                     :class="open && 'translate-y-0'">
                  <p class="font-mono text-[10px] uppercase tracking-[0.16em] text-brand-400" x-text="L('speakers.talk')"></p>
                  <p class="mt-1 font-display text-sm font-semibold leading-snug" x-text="t(sp.talk)"></p>
                  <p class="mt-3 text-xs leading-relaxed text-slate-300" x-text="t(sp.bio)"></p>
                </div>
              </div>
              <!-- Bilgi -->
              <div class="p-5">
                <p class="font-mono text-[11px] uppercase tracking-[0.14em] text-slate-500" x-text="t(sp.title)"></p>
                <h3 class="mt-1 font-display text-lg font-bold text-ink" x-text="sp.name"></h3>
                <p class="mt-1 flex items-center gap-1.5 text-sm text-slate-600">
                  <span class="shrink-0 text-slate-400" x-html="icon('building-2', 'h-3.5 w-3.5')"></span>
                  <span x-text="t(sp.affiliation)"></span>
                </p>
                <button type="button" @click="open = !open" class="mt-4 inline-flex items-center gap-1.5 text-xs font-semibold text-brand-700 lg:hidden">
                  <span x-text="open ? L('speakers.hide') : L('speakers.details')"></span>
                  <span x-html="icon('chevron-down', 'h-3.5 w-3.5')" class="transition" :class="open && 'rotate-180'"></span>
                </button>
              </div>
            </article>
          </template>
        </div>
      </div>
    </section>

    <!-- ============================== KURULLAR ============================== -->
    <section id="committees" class="border-y border-slate-200 bg-white py-20 sm:py-28">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="max-w-2xl">
          <span class="eyebrow"><span class="h-px w-6 bg-brand-600"></span><span x-text="L('committees.eyebrow')"></span></span>
          <h2 class="section-title mt-4" x-text="L('committees.title')"></h2>
        </div>

        <!-- Sekmeler -->
        <div class="mt-10 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <div class="no-scrollbar -mx-4 overflow-x-auto px-4 sm:mx-0 sm:px-0">
            <div class="inline-flex gap-1 rounded-full border border-slate-200 bg-paper p-1" role="tablist">
              <template x-for="tab in committeeTabs" :key="tab.id">

                  <span x-text="L(tab.key)"></span>
                  <span class="ml-1 font-mono text-[10px] tabular opacity-60" x-text="data.committees[tab.id].length"></span>
                </button>
              </template>
            </div>
          </div>

          <!-- Bilim kurulu arama -->
          <div x-show="committeeTab === 'scientific'" x-transition.opacity class="relative w-full sm:w-80">
            <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" x-html="icon('search', 'h-4 w-4')"></span>
            <input type="search" x-model="search" :placeholder="L('committees.search')" :aria-label="L('committees.search')" class="search-input" />
          </div>
        </div>

        <template x-for="tabId in ['honorary', 'organizing']" :key="tabId">
          <div x-show="committeeTab === tabId" x-transition.opacity.duration.250ms class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3" role="tabpanel">
            <template x-for="m in data.committees[tabId]" :key="m.name">
              <div class="card flex items-center gap-4 p-5">
                <span class="grid h-12 w-12 shrink-0 place-items-center rounded-full border border-slate-200 bg-paper font-display text-sm font-bold text-ink" x-text="initials(m.name)"></span>

                  <p class="font-mono text-[10px] uppercase tracking-[0.14em] text-brand-700" x-text="t(m.role)"></p>

                </div>
              </div>

          </div>

          { id: 'travel', key: 'nav.travel', icon: 'map' },
          { id: 'gallery', key: 'nav.gallery', icon: 'images', when: (d) => d.gallery.length > 0 },
          { id: 'faq', key: 'nav.faq', icon: 'circle-help' }
        ],
        committeeTabs: [
          { id: 'honorary', key: 'committees.honorary' },

          { id: 'scientific', key: 'committees.scientific' }
        ],

        init() {
          try {
            const saved = localStorage.getItem('issdt-lang');
            if (saved === 'tr' || saved === 'en') this.lang = saved;
            else if ((navigator.language || '').toLowerCase().startsWith('en')) this.lang = 'en';
            this.announcementDismissed = localStorage.getItem('issdt-announcement') === this.data.announcement.id;
          } catch (e) { /* depolama erişilemez */ }
          document.documentElement.lang = this.lang;

          const p = new URLSearchParams(location.search).get('phase');
          if (['cfp', 'live', 'archive'].includes(p)) this.previewPhase = p;
          if (this.phase === 'live') this.dayTab = this.liveDayIndex;

          setInterval(() => { this.now = Date.now(); }, 1000);

          // Görünürdeki bölümü menüde vurgula
          this.$nextTick(() => {
            const observer = new IntersectionObserver((entries) => {
              entries.forEach((entry) => { if (entry.isIntersecting) this.activeSection = entry.target.id; });
            }, { rootMargin: '-45% 0px -50% 0px' });
            this.navItems.forEach((l) => { const el = document.getElementById(l.id); if (el) observer.observe(el); });
          });
        },

        setLang(l) {
          this.lang = l;
          document.documentElement.lang = l;
          try { localStorage.setItem('issdt-lang', l); } catch (e) { /* yoksay */ }
        },

        // Çok dilli değer → aktif dildeki metin
        t(v) {
          if (v && typeof v === 'object' && !Array.isArray(v)) return v[this.lang] ?? v.tr;
          return v;
        },
        // Arayüz etiketi
        L(key) { return uiText[this.lang][key] ?? key; },

        // Lucide ikonunu satır içi SVG olarak üretir (Alpine ile reaktif kalır)
        icon(name, cls = 'h-5 w-5') {
          const lib = window.lucide && window.lucide.icons;
          if (!lib) return '';
          const key = name.split('-').map((s) => s.charAt(0).toUpperCase() + s.slice(1)).join('');
          let node = lib[key];
          if (!node) return '';
          if (node[0] === 'svg') node = node[2];
          const inner = node.map(([tag, attrs]) =>
            '<' + tag + ' ' + Object.entries(attrs).map(([k, v]) => k + '="' + v + '"').join(' ') + '/>'
          ).join('');
          return '<svg xmlns="http://www.w3.org/2000/svg" class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
        },

        initials(name) {
          return name.split(/\s+/).filter((p) => p && !p.endsWith('.')).map((p) => p.charAt(0)).slice(0, 2).join('').toLocaleUpperCase('tr');
        },

        trackCode(i) { return 'T' + String(i + 1).padStart(2, '0'); },

        formatDate(iso, withWeekday = false) {
          const d = new Date(iso.length === 10 ? iso + 'T12:00:00+03:00' : iso);
          const opts = { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Europe/Istanbul' };
          if (withWeekday) { delete opts.year; opts.weekday = 'long'; }
          return new Intl.DateTimeFormat(this.lang === 'tr' ? 'tr-TR' : 'en-GB', opts).format(d);
        },

        norm(s) {
          return (s || '').toLocaleLowerCase('tr').replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, '');
        },

        dateOf(key) {
          const d = this.data.importantDates.find((x) => x.key === key);
          return d ? d.date : '';
        },

        async copy(text, id) {
          try { await navigator.clipboard.writeText(text); } catch (e) { return; }
          this.copied = id;
          setTimeout(() => { if (this.copied === id) this.copied = ''; }, 2000);
        },

        // ---- Faz (çağrı → canlı → arşiv) ----
        get phase() {
          const o = this.previewPhase || this.data.meta.phaseOverride;
          if (o) return o;
          if (this.now < new Date(this.data.meta.startDate).getTime()) return 'cfp';
          if (this.now <= new Date(this.data.meta.endDate).getTime()) return 'live';
          return 'archive';
        },
        get cta() {
          if (this.phase === 'live') return { key: 'cta.live', href: '#program', icon: 'radio', external: false };
          if (this.phase === 'archive') return { key: 'cta.proceedings', href: (this.data.proceedings[0] || {}).url || '#', icon: 'book-down', external: false };
          const url = this.data.meta.submissionUrl;
          if (this.now < new Date(this.dateOf('abstract')).getTime()) return { key: 'cta.abstract', href: url, icon: 'send', external: true };
          if (this.now < new Date(this.dateOf('fullpaper')).getTime()) return { key: 'cta.fullpaper', href: url, icon: 'send', external: true };
          return { key: 'cta.register', href: '#registration', icon: 'ticket', external: false };
        },
        get announcementVisible() {
          return this.data.announcement.active && !this.announcementDismissed && this.phase === 'cfp';
        },
        dismissAnnouncement() {
          this.announcementDismissed = true;
          try { localStorage.setItem('issdt-announcement', this.data.announcement.id); } catch (e) { /* yoksay */ }
        },

        // ---- Menü ----
        get visibleNav() { return this.navItems.filter((l) => !l.when || l.when(this.data)); },
        get primaryNav() { return this.visibleNav.filter((l) => l.primary); },
        get secondaryNav() { return this.visibleNav.filter((l) => !l.primary); },

        // ---- Geri sayım ----
        get countdownUnits() {
          const s = Math.max(0, Math.floor((new Date(this.data.meta.countdownTarget).getTime() - this.now) / 1000));
          const pad = (n) => String(n).padStart(2, '0');
          return [
            { key: 'cd.days', value: String(Math.floor(s / 86400)).padStart(3, '0') },
            { key: 'cd.hours', value: pad(Math.floor((s % 86400) / 3600)) },
            { key: 'cd.minutes', value: pad(Math.floor((s % 3600) / 60)) },
            { key: 'cd.seconds', value: pad(s % 60) }
          ];
        },

        // ---- Canlı mod ----
        get istanbulNow() {
          const parts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Europe/Istanbul', year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
          }).formatToParts(new Date(this.now));
          const g = (type) => parts.find((p) => p.type === type).value;
          return { date: g('year') + '-' + g('month') + '-' + g('day'), time: g('hour') + ':' + g('minute') };
        },
        get liveDayIndex() {
          const i = this.data.program.findIndex((d) => d.date === this.istanbulNow.date);
          return i < 0 ? 0 : i;
        },
        get isEventDay() { return this.data.program.some((d) => d.date === this.istanbulNow.date); },
        get liveNow() {
          if (!this.isEventDay) return [];
          const t = this.istanbulNow.time;
          return this.data.program[this.liveDayIndex].sessions.filter((s) => s.start <= t && t < s.end);
        },
        get liveNext() {
          const t = this.isEventDay ? this.istanbulNow.time : '00:00';
          return this.data.program[this.liveDayIndex].sessions.find((s) => s.start > t) || null;
        },
        isLiveSession(s) {
          return this.phase === 'live' && this.dayTab === this.liveDayIndex && this.liveNow.includes(s);
        },
        hallLink(s) {
          const h = this.data.halls.find((x) => x.id === s.hallId);
          return h && h.onlineUrl ? h.onlineUrl : '';
        },
        goToDay(i) {
          this.dayTab = i;
          this.hallFilter = 'all';
          document.getElementById('program').scrollIntoView({ behavior: 'smooth' });
        },

        // ---- Hakkında istatistikleri (veriden türetilir) ----
        get aboutStats() {
          const sessions = this.data.program.reduce((n, d) => n + d.sessions.filter((s) => s.type === 'session').length, 0);
          return [
            { key: 'stat.days', value: String(this.data.program.length).padStart(2, '0') },
            { key: 'stat.tracks', value: String(this.data.tracks.length).padStart(2, '0') },
            { key: 'stat.keynotes', value: String(this.data.speakers.length).padStart(2, '0') },
            { key: 'stat.sessions', value: String(sessions).padStart(2, '0') }
          ];
        },
        get countryCount() {
          return new Set(this.data.committees.scientific.map((m) => m.country.en)).size;
        },
        get incentiveFacts() {
          const foreignMembers = this.data.committees.scientific.filter((m) => m.country.en !== 'Türkiye').length;
          const foreignKeynotes = this.data.speakers.filter((s) => s.country !== 'TR').length;
          return [
            { key: 'inc.countries', value: this.countryCount },
            { key: 'inc.foreignMembers', value: foreignMembers },
            { key: 'inc.foreignKeynotes', value: foreignKeynotes },
            { key: 'inc.isbn', value: 'ISBN' },
            { key: 'inc.review', value: '2× blind' },
            { key: 'inc.languages', value: 'TR · EN' }
          ];
        },

        // ---- Zaman çizelgesi ----
        get timeline() {
          let activeFound = false;
          return this.data.importantDates.map((d) => {
            const ts = new Date(d.date).getTime();
            let status;
            if (ts < this.now) status = 'done';
            else if (!activeFound) { status = 'active'; activeFound = true; }
            else status = 'upcoming';
            return { ...d, status, daysLeft: Math.max(0, Math.ceil((ts - this.now) / 86400000)) };
          });
        },
        get timelineDone() { return this.timeline.filter((d) => d.status === 'done').length; },
        get activeDate() { return this.timeline.find((d) => d.status === 'active'); },

        // ---- Kayıt ----
        get earlyBird() { return this.now < new Date(this.dateOf('earlyreg')).getTime(); },

        // ---- Bilim kurulu filtresi ----
        get scientificFiltered() {
          const q = this.norm(this.search.trim());
          if (!q) return this.data.committees.scientific;
          return this.data.committees.scientific.filter((m) =>
            this.norm([m.title, m.name, m.affiliation.tr, m.affiliation.en, m.field.tr, m.field.en, m.country.tr, m.country.en].join(' ')).includes(q)
          );
        },

        // ---- Kabul edilen bildiriler filtresi ----
        get papersFiltered() {
          const q = this.norm(this.paperSearch.trim());
          return this.data.acceptedPapers.list.filter((p) =>
            (this.paperTrack === 'all' || p.track === this.paperTrack) &&
            (!q || this.norm([p.id, p.title, p.authors].join(' ')).includes(q))
          );
        },

        // ---- Program ----
        get programItems() {
          const day = this.data.program[this.dayTab];
          if (this.hallFilter === 'all') return day.sessions;
          return day.sessions.filter((s) => s.type !== 'session' || s.hallId === this.hallFilter);
        },
        typeStyle(type) {
          return {
            keynote: 'bg-accent-100 text-accent-800',
            session: 'bg-brand-50 text-brand-800',
            panel: 'bg-ink text-white',
            ceremony: 'bg-slate-900 text-white',
            break: 'bg-slate-100 text-slate-500',
            registration: 'bg-slate-100 text-slate-600',
            poster: 'bg-sky-50 text-sky-800',
            social: 'bg-rose-50 text-rose-800'
          }[type] || 'bg-slate-100 text-slate-600';
        },
        typeIcon(type) {
          return {
            keynote: 'mic', session: 'presentation', panel: 'messages-square', ceremony: 'award',
            break: 'coffee', registration: 'clipboard-check', poster: 'layout-panel-top', social: 'utensils'
          }[type] || 'circle';
        }
      };
    }
  </script>
