<!doctype html>
<!-- og-image.png kaynağı (1200x630). Yeniden üretmek için memory.md > "Görsel üretimi" bölümüne bakın. -->
<html lang="tr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=sentient@300,300i&f[]=general-sans@400,500&display=swap" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #F3F1EA; color: #161A15; font-family: 'General Sans', sans-serif; padding: 64px 80px; display: flex; flex-direction: column; position: relative; }
  .topo { position: absolute; inset: 0; background: rgba(47,75,55,.16); -webkit-mask: url(../img/topo.svg) center / cover no-repeat, radial-gradient(ellipse 70% 80% at 80% 40%, #000 30%, transparent 85%); -webkit-mask-composite: source-in; }
  .top, h1, .sub, .bottom { position: relative; }
  .top { display: flex; align-items: baseline; gap: 10px; font-family: 'Sentient', serif; font-size: 30px; }
  .top small { font-family: 'General Sans', sans-serif; font-size: 18px; color: #7F877B; }
  .kicker { position: relative; margin-top: 58px; font-size: 22px; color: #7F877B; }
  h1 { margin-top: 10px; font-family: 'Sentient', serif; font-weight: 300; font-size: 76px; line-height: 1; letter-spacing: -.035em; }
  h1 em { font-style: italic; color: #2F4B37; }
  .bottom { margin-top: auto; display: flex; gap: 12px; align-items: center; font-size: 21px; color: #4A5147; }
  .pill { padding: 10px 20px; border-radius: 999px; background: #FBFAF6; border: 1px solid rgba(30,36,28,.1); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #B4843A; display: inline-block; margin-right: 10px; vertical-align: middle; }
</style>
</head>
<body>
  <div class="topo"></div>
  <div class="top">ECEP <small>2027</small></div>
  <p class="kicker">Workshop on</p>
  <h1>Environment, <em>Clean Energy,</em><br>and Economic Policy</h1>
  <div class="bottom">
    <span class="pill"><span class="dot"></span>18–19 Ocak 2027</span>
    <span class="pill">YTÜ Davutpaşa Kampüsü, İstanbul</span>
    <span class="pill">YTÜ İİBF İktisat Bölümü</span>
  </div>
</body>
</html>
