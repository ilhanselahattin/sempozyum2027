<!doctype html>
<!-- og-image.png kaynağı (1200x630). Yeniden üretmek için memory.md > "Görsel üretimi" bölümüne bakın. -->
<html lang="tr">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0B0F19;
    background-image: radial-gradient(rgba(255,255,255,.08) 1.2px, transparent 1.2px);
    background-size: 26px 26px;
    color: #fff; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
    padding: 72px 80px; display: flex; flex-direction: column; position: relative;
  }
  .top { display: flex; align-items: center; gap: 18px; }
  .logo { width: 64px; height: 64px; border-radius: 14px; background: #fff; color: #0B0F19; display: grid; place-items: center; font-weight: 800; font-size: 22px; }
  .acr { font-weight: 800; font-size: 28px; }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; color: #34d399; }
  h1 { margin-top: 56px; font-size: 64px; line-height: 1.06; font-weight: 800; letter-spacing: -.02em; max-width: 980px; }
  h1 span { color: #10b981; }
  .bottom { margin-top: auto; display: flex; gap: 14px; }
  .pill { border: 1.5px solid rgba(255,255,255,.18); border-radius: 999px; padding: 12px 22px; font-size: 22px; font-weight: 600; }
  .pill.amber { background: #D97706; border-color: #D97706; color: #0B0F19; }
  .bar { position: absolute; left: 0; bottom: 0; height: 10px; width: 100%; background: linear-gradient(90deg, #059669 0 70%, #D97706 70% 100%); }
</style>
</head>
<body>
  <div class="top">
    <div class="logo">SDT</div>
    <div>
      <div class="acr">SDT 2027</div>
      <div class="mono">Uluslararası Çalıştay</div>
    </div>
  </div>
  <h1>Sürdürülebilir Gelecek İçin <span>Dijital Dönüşümü Yeniden Düşünmek</span></h1>
  <div class="bottom">
    <div class="pill">18–19 Ocak 2027</div>
    <div class="pill">Ankara · Hibrit</div>
    <div class="pill amber">Bildiri Çağrısı</div>
  </div>
  <div class="bar"></div>
</body>
</html>
